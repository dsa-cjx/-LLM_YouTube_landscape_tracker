name: Update LLM YouTube Landscape Tracker

on:
  workflow_dispatch:

  schedule:
    # Runs every 6 hours.
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-llm-youtube-landscape-tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run tracker update
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POE_API_KEY: ${{ secrets.POE_API_KEY }}
        run: |
          python scripts/update.py
          if [ -f scripts/build_table_page.py ]; then
            python scripts/build_table_page.py
          fi

      - name: Show generated files
        run: |
          echo "Generated docs files:"
          find docs -maxdepth 2 -type f | sort
          echo ""
          echo "Git status:"
          git status --short

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs scripts

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update YouTube landscape tracker data"
            git push
          fi